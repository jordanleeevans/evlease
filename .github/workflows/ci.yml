name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  vehicles:
    name: Vehicles service — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/vehicles

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: services/vehicles/.python-version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  leasing:
    name: Leasing service — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/leasing

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: services/leasing/.python-version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  schema:
    name: Supergraph schema composition
    runs-on: ubuntu-latest
    needs: [vehicles, leasing]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rover
        run: |
          curl -sSL https://rover.apollo.dev/nix/latest | sh
          echo "$HOME/.rover/bin" >> $GITHUB_PATH

      - name: Start subgraph services
        run: docker compose up -d vehicles leasing
        env:
          APOLLO_ELV2_LICENSE: accept

      - name: Wait for subgraphs to be healthy
        run: |
          for service in vehicles leasing; do
            echo "Waiting for $service..."
            for i in $(seq 1 30); do
              docker compose ps $service | grep healthy && break
              sleep 2
            done
          done

      - name: Compose supergraph
        run: |
          rover supergraph compose \
            --config gateway/supergraph.yaml \
            --output /tmp/supergraph.graphql
        env:
          APOLLO_ELV2_LICENSE: accept

      - name: Verify supergraph schema was produced
        run: test -s /tmp/supergraph.graphql
